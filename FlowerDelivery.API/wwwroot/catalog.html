<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог букетов — FlowerDelivery</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        header {
            background: #d63384;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
        }

        nav a {
            color: white;
            margin-right: 15px;
            text-decoration: none;
            font-weight: bold;
        }

            nav a:hover {
                text-decoration: underline;
            }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .bouquets {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .bouquet-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

            .bouquet-card h3 {
                color: #d63384;
                margin-bottom: 10px;
            }

            .bouquet-card .price {
                font-size: 24px;
                font-weight: bold;
                color: #333;
                margin: 10px 0;
            }

            .bouquet-card .stock {
                color: #666;
                font-size: 14px;
            }

                .bouquet-card .stock.low {
                    color: #dc3545;
                    font-weight: bold;
                }

        .btn {
            background: #d63384;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }

            .btn:hover {
                background: #b02a6e;
            }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>🌸 FlowerDelivery</h1>
            <nav>
                <a href="catalog.html">Каталог</a>
                <a href="order.html">Создать заказ</a>
                <a href="track.html">Отследить заказ</a>
                <a href="courier.html">Панель курьера</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <h2 style="margin-bottom: 20px;">Доступные букеты</h2>
        <div id="error"></div>
        <div class="bouquets" id="bouquets">
            <p>Загрузка...</p>
        </div>
    </div>

    <script>
        async function loadBouquets() {
            try {
                const response = await fetch('/api/Bouquets');
                if (!response.ok) throw new Error('Ошибка загрузки');
                const bouquets = await response.json();

                const container = document.getElementById('bouquets');
                if (bouquets.length === 0) {
                    container.innerHTML = '<p>Каталог пуст. Добавьте букеты через API.</p>';
                    return;
                }

                container.innerHTML = bouquets.map(b => `
                    <div class="bouquet-card">
                        <h3>${b.name}</h3>
                        <p>${b.description}</p>
                        <div class="price">${b.price.toLocaleString('ru-RU')} ₽</div>
                        <div class="stock ${b.stockQuantity < 5 ? 'low' : ''}">
                            На складе: ${b.stockQuantity} шт.
                        </div>
                        <a href="order.html?bouquetId=${b.id}" class="btn">Заказать</a>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('error').innerHTML =
                    `<div class="error">Ошибка: ${err.message}. Убедитесь, что API запущен.</div>`;
            }
        }

        loadBouquets();
    </script>
</body>
</html>
