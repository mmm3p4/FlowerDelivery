<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создать заказ — FlowerDelivery</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        header {
            background: #d63384;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
        }

        nav a {
            color: white;
            margin-right: 15px;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .btn {
            background: #d63384;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

            .btn:hover {
                background: #b02a6e;
            }

        .btn-secondary {
            background: #6c757d;
            margin-left: 10px;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .item-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

            .item-row input {
                flex: 1;
            }

            .item-row button {
                background: #dc3545;
                color: white;
                border: none;
                padding: 8px 15px;
                border-radius: 5px;
                cursor: pointer;
            }
    </style>
</head>
<body>
    <header>
        <div class="container" style="background: transparent; box-shadow: none; padding: 0;">
            <h1>🌸 FlowerDelivery</h1>
            <nav>
                <a href="catalog.html">Каталог</a>
                <a href="order.html">Создать заказ</a>
                <a href="track.html">Отследить заказ</a>
                <a href="courier.html">Панель курьера</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <h2 style="margin-bottom: 20px;">Оформление заказа</h2>
        <div id="message"></div>

        <form id="orderForm">
            <div class="form-group">
                <label>ID клиента *</label>
                <input type="number" id="clientId" value="1" min="1" required>
            </div>

            <div class="form-group">
                <label>Имя получателя *</label>
                <input type="text" id="recipientName" placeholder="Иванова Мария" required>
            </div>

            <div class="form-group">
                <label>Телефон получателя *</label>
                <input type="text" id="recipientPhone" placeholder="+79001234567" required>
            </div>

            <div class="form-group">
                <label>Адрес доставки *</label>
                <input type="text" id="deliveryAddress" placeholder="ул. Пушкина, 5, кв. 12" required>
            </div>

            <div class="form-group">
                <label>Время доставки *</label>
                <input type="datetime-local" id="deliveryTime" required>
            </div>

            <div class="form-group">
                <label>Позиции заказа *</label>
                <div id="items">
                    <div class="item-row">
                        <input type="number" placeholder="ID букета" class="bouquet-id" min="1" required>
                        <input type="number" placeholder="Кол-во" class="quantity" min="1" value="1" required>
                        <button type="button" onclick="removeItem(this)">✕</button>
                    </div>
                </div>
                <button type="button" class="btn btn-secondary" onclick="addItem()" style="margin-top: 10px;">+ Добавить позицию</button>
            </div>

            <button type="submit" class="btn">Создать заказ</button>
            <a href="catalog.html" class="btn btn-secondary">Отмена</a>
        </form>
    </div>

    <script>
        // Если пришли с каталога с параметром bouquetId
        const urlParams = new URLSearchParams(window.location.search);
        const preselectedBouquet = urlParams.get('bouquetId');
        if (preselectedBouquet) {
            document.querySelector('.bouquet-id').value = preselectedBouquet;
        }

        function addItem() {
            const items = document.getElementById('items');
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
                <input type="number" placeholder="ID букета" class="bouquet-id" min="1" required>
                <input type="number" placeholder="Кол-во" class="quantity" min="1" value="1" required>
                <button type="button" onclick="removeItem(this)">✕</button>
            `;
            items.appendChild(row);
        }

        function removeItem(btn) {
            btn.parentElement.remove();
        }

        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('message');
            msgDiv.innerHTML = '';

            const items = Array.from(document.querySelectorAll('.item-row')).map(row => ({
                bouquetId: parseInt(row.querySelector('.bouquet-id').value),
                quantity: parseInt(row.querySelector('.quantity').value)
            }));

            const order = {
                clientId: parseInt(document.getElementById('clientId').value),
                recipientName: document.getElementById('recipientName').value,
                recipientPhone: document.getElementById('recipientPhone').value,
                deliveryAddress: document.getElementById('deliveryAddress').value,
                deliveryTime: new Date(document.getElementById('deliveryTime').value).toISOString(),
                items: items
            };

            try {
                const response = await fetch('/api/Orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(order)
                });

                const data = await response.json();

                if (!response.ok) {
                    msgDiv.innerHTML = `<div class="error">${data.message || 'Ошибка создания заказа'}</div>`;
                    return;
                }

                msgDiv.innerHTML = `
                    <div class="success">
                        <strong>Заказ успешно создан!</strong><br>
                        ID заказа: ${data.id}<br>
                        Сумма: ${data.totalAmount.toLocaleString('ru-RU')} ₽<br>
                        Статус: ${data.status}
                        <br><br>
                        <a href="track.html?id=${data.id}" class="btn">Отследить заказ</a>
                    </div>
                `;
                document.getElementById('orderForm').reset();
            } catch (err) {
                msgDiv.innerHTML = `<div class="error">Ошибка: ${err.message}</div>`;
            }
        });
    </script>
</body>
</html>s
